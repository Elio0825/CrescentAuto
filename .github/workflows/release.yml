name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "*.*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build --configuration Release --warnaserror

      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrescentAuto
          path: bin/Release/CrescentAuto/latest.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" bin/Release/CrescentAuto/latest.zip --verify-tag --generate-notes --title "CrescentAuto ${{ github.ref_name }}"
